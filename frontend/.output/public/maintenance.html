<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>メンテナンス中 | Famie</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #334155; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 448px; padding: 32px; border: 1px solid #e2e8f0; border-radius: 16px; background: white; text-align: center; }
      h1 { font-size: 20px; color: #1e293b; }
      .brand { color: #2563eb; font-weight: bold; }
      button { margin-top: 16px; border: 0; border-radius: 8px; padding: 12px 24px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Famie</p>
      <h1>ただいまメンテナンス中です</h1>
      <p>しばらくしてから再試行してください。</p>
      <button type="button" id="retry">再試行</button>
      <p id="message" role="status"></p>
      <noscript>再開後にページを読み込み直してください。</noscript>
    </main>
    <script>
      const button = document.getElementById('retry')
      const message = document.getElementById('message')
      button.addEventListener('click', async () => {
        button.disabled = true
        message.textContent = ''
        try {
          const response = await fetch('/api/v1/status', { cache: 'no-store', headers: { Accept: 'application/json' } })
          const data = await response.json()
          if (response.ok && data.status === 'ok') {
            window.location.replace('/')
            return
          }
          message.textContent = response.status === 503 && data.code === 'maintenance'
            ? 'まだメンテナンス中です。しばらくしてから再試行してください。'
            : '復旧状況を確認できませんでした。通信環境を確認して再試行してください。'
        } catch {
          message.textContent = '復旧状況を確認できませんでした。通信環境を確認して再試行してください。'
        } finally {
          button.disabled = false
        }
      })
    </script>
  </body>
</html>
