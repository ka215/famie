<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title data-i18n="title">メンテナンス中 | Famie / Maintenance | Famie</title>
    <meta name="theme-color" content="#f8fafc">
    <script src="/theme.js"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #334155; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 448px; padding: 32px; border: 1px solid #e2e8f0; border-radius: 16px; background: white; text-align: center; }
      h1 { font-size: 20px; color: #1e293b; }
      .brand { color: #2563eb; font-weight: bold; }
      button { margin-top: 16px; border: 0; border-radius: 8px; padding: 12px 24px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; }
      :root { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      [data-theme="dark"] body { background: #020617; color: #cbd5e1; }
      [data-theme="dark"] main { background: #1e293b; border-color: #334155; }
      [data-theme="dark"] h1 { color: #f1f5f9; }
      [data-theme="dark"] .brand { color: #93c5fd; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Famie</p>
      <h1><!-- i18n:heading --><span lang="ja">ただいまメンテナンス中です</span><br><span lang="en">Maintenance in progress</span><!-- /i18n:heading --></h1>
      <p><!-- i18n:help --><span lang="ja">しばらくしてから再試行してください。</span><br><span lang="en">Please try again later.</span><!-- /i18n:help --></p>
      <button type="button" id="retry"><!-- i18n:retry --><span lang="ja">再試行</span><br><span lang="en">Try again</span><!-- /i18n:retry --></button>
      <p id="message" role="status"></p>
      <noscript><!-- i18n:noscript --><span lang="ja">再開後にページを読み込み直してください。</span><br><span lang="en">Reload this page after service resumes.</span><!-- /i18n:noscript --></noscript>
    </main>
    <script>
      const staticMessages = /* i18n:messages */{"retry":"再試行 / Try again","checking":"確認中… / Checking…","stillDown":"まだメンテナンス中です。しばらくしてから再試行してください。 / Maintenance is still in progress. Please try again later.","checkFailed":"復旧状況を確認できませんでした。通信環境を確認して再試行してください。 / Could not check service availability. Check your connection and try again."}/* /i18n:messages */
      const button = document.getElementById('retry')
      const message = document.getElementById('message')
      button.addEventListener('click', async () => {
        button.disabled = true
        button.textContent = staticMessages.checking
        message.textContent = ''
        try {
          const response = await fetch('/api/v1/status', { cache: 'no-store', headers: { Accept: 'application/json' } })
          const data = await response.json()
          if (response.ok && data.status === 'ok') {
            window.location.replace('/')
            return
          }
          message.textContent = response.status === 503 && data.code === 'maintenance'
            ? staticMessages.stillDown
            : staticMessages.checkFailed
        } catch {
          message.textContent = staticMessages.checkFailed
        } finally {
          button.disabled = false
          button.textContent = staticMessages.retry
        }
      })
    </script>
  </body>
</html>
