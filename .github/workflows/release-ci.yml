name: Release CI
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (X.Y.Z)
        required: true
        type: string
      build_artifact:
        description: Build and retain a release candidate artifact
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.20.0
          standalone: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |-
            frontend/pnpm-lock.yaml
            .github/workflows/release-ci.yml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:2.10.3
          coverage: none
          extensions: pdo_pgsql, pdo_sqlite
      - name: Install backend dependencies for API contract
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check translations and static localization
        working-directory: frontend
        run: pnpm i18n:check
      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck
      - name: Frontend unit tests with coverage
        working-directory: frontend
        run: |-
          node ../scripts/coverage/test-mapping.mjs
          pnpm test:coverage
      - name: Install pinned yq
        shell: bash
        run: |-
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify OpenAPI contract
        working-directory: frontend
        run: pnpm test:api
      - name: Publish frontend coverage summary
        run: node scripts/coverage/report.mjs coverage-results/frontend-unit/summary.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-frontend-unit-${{ github.run_id }}
          path: coverage-results/frontend-unit/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify mandatory PR check waiting
        shell: pwsh
        run: ./scripts/release/test-pr-checks.ps1
      - name: Test scheduler diagnostic wrapper
        run: node --test scripts/release/run-scheduler.test.mjs
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.20.0
          standalone: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |-
            frontend/pnpm-lock.yaml
            .github/workflows/release-ci.yml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: none
          extensions: pdo_sqlite
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Install Playwright OS dependencies
        timeout-minutes: 8
        working-directory: frontend
        run: bash ../scripts/release/install-playwright-deps.sh ${{ matrix.browser }}
      - name: Install Playwright browsers
        timeout-minutes: 5
        working-directory: frontend
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: pnpm exec playwright install ${{ matrix.browser }}
      - name: Application E2E
        working-directory: frontend
        run: pnpm test:e2e --project=${{ matrix.project }}
      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-e2e-${{ matrix.project }}-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: iphone-webkit
            browser: webkit
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require all verification jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SQLITE_RESULT: ${{ needs.backend-sqlite.result }}
          POSTGRES_RESULT: ${{ needs.backend-postgres.result }}
        run: '[[ "$CHECKS_RESULT" == success && "$E2E_RESULT" == success && "$SECURITY_RESULT" == success && "$SQLITE_RESULT" == success && "$POSTGRES_RESULT" == success ]]'
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.20.0
          standalone: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |-
            frontend/pnpm-lock.yaml
            .github/workflows/release-ci.yml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright OS dependencies
        timeout-minutes: 8
        working-directory: frontend
        run: bash ../scripts/release/install-playwright-deps.sh chromium webkit
      - name: Install Playwright browsers
        timeout-minutes: 5
        working-directory: frontend
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: pnpm exec playwright install chromium webkit
      - name: Clean release build
        working-directory: frontend
        run: |
          pnpm exec nuxi cleanup
          pnpm build
      - name: Verify generated assets
        run: node scripts/release/verify-static-assets.mjs frontend/.output/public
      - name: Release browser smoke test
        working-directory: frontend
        run: pnpm test:release
      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-release-${{ github.run_id }}
          path: |
            frontend/playwright-release-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Resolve candidate version
        id: version
        if: github.event_name == 'workflow_dispatch' && inputs.build_artifact
        shell: bash
        run: |
          [[ '${{ inputs.version }}' =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          metadata=$(jq -ser -f scripts/release/version-state.jq version.json backend/package.json frontend/package.json)
          IFS=$'\t' read -r current next state <<< "$metadata"
          [[ "$next" == '${{ inputs.version }}' && "$state" == next ]]
          echo "value=$next" >> "$GITHUB_OUTPUT"
      - name: Create release artifact
        id: artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_artifact
        shell: bash
        run: |
          scripts/release/create-artifact.sh '${{ inputs.version }}' release-dist
          echo "name=$(cat release-dist/artifact-name.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload release artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Verify development HTTPS tooling stays outside the static runtime
        run: node scripts/security/check-forge-scope.mjs --built
    needs:
      - checks
      - e2e
      - security
      - backend-sqlite
      - backend-postgres
    if: ${{ always() }}
  security:
    uses: ./.github/workflows/security-checks.yml
    with:
      base_commit: ${{ github.event.pull_request.base.sha || '' }}
  backend-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: pcov
          extensions: pdo_sqlite
          ini-values: pcov.directory=app
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: SQLite full test suite with coverage
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p ../coverage-results/backend-sqlite
          php artisan test --coverage-clover ../coverage-results/backend-sqlite/clover.xml
          php ../scripts/coverage/backend-summary.php ../coverage-results/backend-sqlite/clover.xml backend-sqlite ../coverage-results/backend-sqlite/summary.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - name: Publish coverage summary
        run: node scripts/coverage/report.mjs coverage-results/backend-sqlite/summary.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-backend-sqlite-${{ github.run_id }}
          path: coverage-results/backend-sqlite/summary.json
          if-no-files-found: error
          retention-days: 14
  backend-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: famie_test
          POSTGRES_PASSWORD: famie-ci-only
          POSTGRES_DB: famie_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U famie_test -d famie_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: famie_test
      DB_USERNAME: famie_test
      DB_PASSWORD: famie-ci-only
      FAMIE_REWARD_PG_TEST: '1'
      FAMIE_CONCURRENCY_TEST: '1'
      FAMIE_BACKUP_PG_TEST: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: pcov
          extensions: pdo_pgsql, pdo_sqlite
          ini-values: pcov.directory=app
      - name: Install PostgreSQL 14 client
        run: |-
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/famie-pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-14
          echo /usr/lib/postgresql/14/bin >> "$GITHUB_PATH"
        shell: bash
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: PostgreSQL focused tests with coverage
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p ../coverage-results/backend-postgres
          php artisan test --filter="RewardPostgresTest|MemberPasswordRecoveryTest|LoginSecurityAlertTest|LoginSecurityTest|PasswordSecurityTest|AccountEmailTest|EmailPrivacyTest|PostgresConcurrencyTest|DailyBackupPostgresTest" --coverage-clover ../coverage-results/backend-postgres/clover.xml
          php ../scripts/coverage/backend-summary.php ../coverage-results/backend-postgres/clover.xml backend-postgres ../coverage-results/backend-postgres/summary.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - name: Publish coverage summary
        run: node scripts/coverage/report.mjs coverage-results/backend-postgres/summary.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-backend-postgres-${{ github.run_id }}
          path: coverage-results/backend-postgres/summary.json
          if-no-files-found: error
          retention-days: 14
env:
  CI: 'true'
  DEBUG: ''
  NUXT_DEBUG_PERF: ''
