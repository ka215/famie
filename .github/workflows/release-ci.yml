name: Release CI
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (X.Y.Z)
        required: true
        type: string
      build_artifact:
        description: Build and retain a release candidate artifact
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.8.10
          coverage: none
          extensions: pdo_pgsql, pdo_sqlite
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck
      - name: Unit tests
        working-directory: frontend
        run: pnpm test:unit
      - name: Install pinned yq
        shell: bash
        run: |-
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify OpenAPI contract
        working-directory: frontend
        run: pnpm test:api
      - name: Backend tests
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          composer test
      - name: Reward PostgreSQL acceptance
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: famie_test
          DB_USERNAME: famie_test
          DB_PASSWORD: famie-ci-only
          FAMIE_REWARD_PG_TEST: "1"
        run: php artisan test --filter=RewardPostgresTest
      - name: Authentication PostgreSQL acceptance
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: famie_test
          DB_USERNAME: famie_test
          DB_PASSWORD: famie-ci-only
        run: php artisan test --filter="MemberPasswordRecoveryTest|LoginSecurityAlertTest|LoginSecurityTest|PasswordSecurityTest"
      - name: Email ownership PostgreSQL acceptance
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: famie_test
          DB_USERNAME: famie_test
          DB_PASSWORD: famie-ci-only
        run: php artisan test --filter="AccountEmailTest|EmailPrivacyTest|PostgresConcurrencyTest::test_two_families_cannot_confirm_the_same_email"
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: famie_test
          POSTGRES_PASSWORD: famie-ci-only
          POSTGRES_DB: famie_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U famie_test -d famie_test" --health-interval 5s --health-timeout 5s --health-retries 10
  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.8.10
          coverage: none
          extensions: pdo_sqlite
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Application E2E
        working-directory: frontend
        run: pnpm test:e2e --project=${{ matrix.project }}
      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ matrix.project }}-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            os: ubuntu-latest
          - project: iphone-webkit
            browser: webkit
            os: macos-15-intel
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require all verification jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: '[[ "$CHECKS_RESULT" == success && "$E2E_RESULT" == success ]]'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Clean release build
        working-directory: frontend
        run: |
          pnpm exec nuxi cleanup
          pnpm build
      - name: Verify generated assets
        run: node scripts/release/verify-static-assets.mjs frontend/.output/public
      - name: Release browser smoke test
        working-directory: frontend
        run: pnpm test:release
      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-${{ github.run_id }}
          path: |
            frontend/playwright-release-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Resolve candidate version
        id: version
        if: github.event_name == 'workflow_dispatch' && inputs.build_artifact
        shell: bash
        run: |
          [[ '${{ inputs.version }}' =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          metadata=$(jq -ser -f scripts/release/version-state.jq version.json backend/package.json frontend/package.json)
          IFS=$'\t' read -r current next state <<< "$metadata"
          [[ "$next" == '${{ inputs.version }}' && "$state" == next ]]
          echo "value=$next" >> "$GITHUB_OUTPUT"
      - name: Create release artifact
        id: artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_artifact
        shell: bash
        run: |
          scripts/release/create-artifact.sh '${{ inputs.version }}' release-dist
          echo "name=$(cat release-dist/artifact-name.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload release artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30
    needs:
      - checks
      - e2e
    if: ${{ always() }}
env:
  CI: 'true'
  DEBUG: ''
  NUXT_DEBUG_PERF: ''
