openapi: 3.1.1
info:
  title: Famie API
  version: 0.15.1
  description: |
    現行v1 API契約。公開環境は/api/v1、Laravel直接アクセスは/v1。
    Accept: application/jsonを送る。Bearer認証でactiveな所属が1件必要。
    groups/{group}は本人の所属家族のみ。admin制約、所有者制約は各操作に記載する。
    認証済み家族APIアクセスはリワード期間準備を開始し、活動・いいね変更は達成判定を行う場合がある。
    グループ内の更新は直列化される。設定値に依存する上限は家族情報と運用設定を参照する。
servers:
  - url: https://famie.ka2.org/api/v1
    description: 本番（専用ドメインへの切替は未実施）
  - url: https://stg-famie.ka2.org/api/v1
    description: ステージング（IP制限あり）
  - url: http://localhost:8000/v1
    description: Laravelローカル直接アクセス
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 認証・本人情報・メール
  - name: groups
    description: 家族とメンバー
  - name: categories
    description: カテゴリ
  - name: activities
    description: 活動・画像・いいね
  - name: rewards
    description: リワード
paths:
  '/status':
    get:
      operationId: getStatus
      summary: 稼働状態を取得
      tags: [auth]
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, const: ok}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  '/auth/login':
    post:
      operationId: login
      summary: ログインし他端末の既存トークンを失効
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [login, password], properties: {login: {type: string, maxLength: 255}, password: {type: string, maxLength: 4096}}}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Login'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Validation'}
        '409': {$ref: '#/components/responses/Conflict'}
        "429":
          $ref: '#/components/responses/RateLimited'
      description: 同一アカウント＋IPで10分間に5回失敗すると10分停止。ログインIDとメールは同一アカウントとして計数。IP全体は60回/分。成功時に失敗回数を消去し、既存パスワードの強度を判定する。値はサーバー設定で変更可能。
  '/auth/register':
    post:
      operationId: register
      summary: 新規家族とadminを登録
      tags: [auth]
      security: []
      description: >-
        group_id・type・role・status・emailの指定禁止。IP毎に既定10分5試行、超過で10分停止。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [group_name, username, display_name, password, password_confirmation], properties: {group_name: {type: string, minLength: 1, maxLength: 50}, username: {$ref: '#/components/schemas/Username'}, display_name: {type: string, minLength: 1, maxLength: 50}, password: {$ref: '#/components/schemas/Password'}, password_confirmation: {$ref: '#/components/schemas/Password'}}}
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Login'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  '/auth/register/username-availability':
    post:
      operationId: usernameAvailability
      summary: ログインIDの利用可否
      tags: [auth]
      security: []
      description: >-
        30回/分/IP。構文検証後に空き状態を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [username], properties: {username: {$ref: '#/components/schemas/Username'}}}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: object, properties: {available: {type: boolean}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  '/auth/logout':
    post:
      operationId: logout
      summary: 現在のトークンを失効
      tags: [auth]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  '/auth/me':
    get:
      operationId: getMe
      summary: 本人情報とactive所属を取得
      tags: [auth]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
    patch:
      operationId: updateMe
      summary: 表示名・敬称を変更
      tags: [auth]
      description: >-
        少なくとも1項目必須。指定外項目は禁止。show_name_suffixはJSON booleanのみ。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {display_name: {type: string, minLength: 1, maxLength: 50}, show_name_suffix: {type: boolean}}, additionalProperties: false, minProperties: 1}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  '/auth/me/password':
    put:
      operationId: updatePassword
      summary: 本人パスワードを変更
      tags: [auth]
      description: >-
        現在のログインは維持。他端末のトークンとメール確認・再設定の未使用リンクを無効化し、強度警告と通知抑制期限を解除。10回/分/ユーザー。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [current_password, new_password, new_password_confirmation], properties: {current_password: {type: string}, new_password: {$ref: '#/components/schemas/Password'}, new_password_confirmation: {$ref: '#/components/schemas/Password'}}}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
        "429":
          $ref: '#/components/responses/RateLimited'
  '/auth/me/email':
    post:
      operationId: requestEmail
      summary: 確認メールを申請
      tags: [auth]
      description: >-
        IP毎10回/分、アドレス・ユーザー毎60秒間隔。確認リンク60分有効。配送失敗時も申請は保存される。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [email, current_password], properties: {email: {type: string, format: email, maxLength: 255}, current_password: {type: string}}, additionalProperties: false}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      operationId: cancelEmail
      summary: 確認待ち申請を取消
      tags: [auth]
      description: >-
        10回/分/IP。確認済みメール自体は削除しない。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '429': {$ref: '#/components/responses/RateLimited'}
  '/auth/me/email/resend':
    post:
      operationId: resendEmail
      summary: 確認メールを再送
      tags: [auth]
      description: >-
        確認待ちの申請が必要。IP毎10回/分、60秒間隔。有効な確認リンクを更新する。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  '/auth/email/verify':
    post:
      operationId: verifyEmail
      summary: メールリンクを確認
      tags: [auth]
      security: []
      description: >-
        20回/分/IP。旧メールからの変更時には旧アドレスへ通知。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [id, token], properties: {id: {$ref: '#/components/schemas/Id'}, token: {type: string, minLength: 64, maxLength: 64}}}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  '/auth/password/forgot':
    post:
      operationId: forgotPassword
      summary: パスワード再設定を申請
      tags: [auth]
      security: []
      description: >-
        IP毎10回/分。アカウント存在有無や配送成否によらず同じ受付応答。リンク30分有効。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [email], properties: {email: {type: string, format: email, maxLength: 255}}}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  '/auth/password/reset':
    post:
      operationId: resetPassword
      summary: リンクでパスワードを再設定
      tags: [auth]
      security: []
      description: >-
        20回/分/IP。成功時は全トークンと他の確認・再設定リンクを失効。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [id, token, password, password_confirmation], properties: {id: {$ref: '#/components/schemas/Id'}, token: {type: string, minLength: 64, maxLength: 64}, password: {$ref: '#/components/schemas/Password'}, password_confirmation: {$ref: '#/components/schemas/Password'}}}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  '/groups/{group}':
    parameters:
      - {name: group, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getGroup
      summary: 所属家族の情報・制限を取得
      tags: [groups]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Group'}, message: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateGroup
      summary: 家族名を変更
      tags: [groups]
      description: >-
        admin専用。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 50}}, additionalProperties: false}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Group'}, message: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  '/groups/{group}/members':
    parameters:
      - {name: group, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getMembers
      summary: activeメンバーを所属ID順で取得
      tags: [groups]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Member'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createMember
      summary: 新規メンバーを作成
      tags: [groups]
      description: >-
        admin専用。人数上限は家族設定（既定10）。既存ユーザーを招待する操作ではない。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [username, display_name, password, password_confirmation, role], properties: {username: {$ref: '#/components/schemas/Username'}, display_name: {type: string, minLength: 1, maxLength: 50}, password: {$ref: '#/components/schemas/Password'}, password_confirmation: {$ref: '#/components/schemas/Password'}, role: {type: string, enum: [admin, member]}}}
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Member'}, message: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  '/groups/{group}/members/inactive':
    parameters:
      - {name: group, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getInactiveMembers
      summary: 無効メンバーを取得
      tags: [groups]
      description: >-
        admin専用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Member'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
  '/groups/{group}/members/{member}':
    parameters:
      - {name: group, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
      - {name: member, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    patch:
      operationId: updateMember
      summary: 表示名・役割を変更
      tags: [groups]
      description: >-
        admin専用。memberは所属ID。自己降格・最後のadminを失う変更は禁止。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [display_name, role], properties: {display_name: {type: string, minLength: 1, maxLength: 50}, role: {type: string, enum: [admin, member]}}, additionalProperties: false}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Member'}, message: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  '/groups/{group}/members/{member}/status':
    parameters:
      - {name: group, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
      - {name: member, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    put:
      operationId: updateMemberStatus
      summary: メンバーを無効化・復元
      tags: [groups]
      description: >-
        admin専用。自己無効化・最後のadmin無効化は禁止。復元時も人数制限。無効化でトークン失効し活動は非表示となるが履歴は保持。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [status], properties: {status: {type: string, enum: [active, inactive]}}, additionalProperties: false}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Member'}, message: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  '/groups/{group}/categories':
    parameters:
      - {name: group, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getCategories
      summary: sort_order・ID順でカテゴリを取得
      tags: [categories]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Category'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createCategory
      summary: カテゴリ作成
      tags: [categories]
      description: >-
        admin専用。同一家族の名前重複禁止。上限既定10。末尾へ追加する。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 255}, color_code: {type: [string, "null"], pattern: "^#[0-9A-Fa-f]{6}$"}}}
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Category'}, message: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  '/groups/{group}/categories/{category}':
    parameters:
      - {name: group, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
      - {name: category, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    put:
      operationId: updateCategory
      summary: カテゴリ名・色を変更
      tags: [categories]
      description: >-
        admin専用。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {name: {type: string, minLength: 1, maxLength: 255}, color_code: {type: [string, "null"], pattern: "^#[0-9A-Fa-f]{6}$"}}}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Category'}, message: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
    delete:
      operationId: deleteCategory
      summary: 未使用カテゴリを削除
      tags: [categories]
      description: >-
        admin専用。活動履歴または未削除リワードの現在・予約条件から参照中なら削除不可。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  '/groups/{group}/logs':
    parameters:
      - {name: group, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getActivities
      summary: 活動を降順・50件ページングで取得
      tags: [activities]
      description: >-
        活動日・時刻・作成日時・IDの降順。activeメンバーのみ。
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: user_id, in: query, required: false, schema: {$ref: '#/components/schemas/Id'}}
        - {name: category_id, in: query, required: false, schema: {$ref: '#/components/schemas/Id'}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200':
          description: 成功
          content:
            application/json:
