            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/Validation'
        "429":
          $ref: '#/components/responses/RateLimited'
        "503":
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token。ログイン時に同一ユーザーの既存トークンを失効し30日有効で発行。
  schemas:
    Id:
      type: integer
      minimum: 1
    Message:
      type: object
      required: [message]
      properties:
        message: {type: string}
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        code: {type: string}
        limit: {type: integer}
        count: {type: integer}
    Username:
      type: string
      minLength: 3
      maxLength: 50
      pattern: '^[a-z0-9](?:[a-z0-9._-]{1,48}[a-z0-9])$'
    Password:
      type: string
      minLength: 15
      writeOnly: true
      maxLength: 72
      description: 15文字以上・UTF-8で72バイト以内。よく使われる語、単純な繰り返し・連番・制御文字は禁止。文字種の組合せは強制しない。ログイン時の既存パスワードには適用しない。
    User:
      type: object
      required: [id, username, display_name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        username: {type: string}
        display_name: {type: string, maxLength: 50}
        show_name_suffix: {type: boolean}
        email: {type: [string, 'null'], format: email}
        email_verified_at: {type: [string, 'null'], format: date-time}
        pending_email: {type: [string, 'null'], format: email}
        email_verification_expires_at: {type: [string, 'null'], format: date-time}
        password_security:
          type: object
          required:
            - status
            - snoozed_until
          properties:
            status:
              type: string
              enum:
                - unknown
                - weak
                - ok
            snoozed_until:
              type:
                - string
                - "null"
              format: date-time
    Group:
      type: object
      required: [id, name, type]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, maxLength: 50}
        type: {type: string, enum: [family]}
        limits:
          type: object
          properties:
            members: {type: integer, description: 既定10}
            categories: {type: integer, description: 既定10}
        images:
          type: object
          properties:
            enabled: {type: boolean}
            used_bytes: {type: integer}
            quota_bytes: {type: integer}
            max_files_per_activity: {type: integer, const: 1}
            max_input_bytes: {type: integer, const: 31457280}
    Membership:
      type: object
      required: [id, role, status, group]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        role: {type: string, enum: [admin, member]}
        status: {type: string, enum: [active, inactive]}
        group: {$ref: '#/components/schemas/Group'}
    Identity:
      type: object
      required: [user, membership]
      properties:
        user: {$ref: '#/components/schemas/User'}
        membership: {$ref: '#/components/schemas/Membership'}
    Login:
      allOf:
        - $ref: '#/components/schemas/Identity'
        - type: object
          required: [access_token, token_type, message]
          properties:
            message: {type: string}
            access_token: {type: string}
            token_type: {type: string, const: Bearer}
    Member:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [membership_id, role]
          properties:
            membership_id: {$ref: '#/components/schemas/Id'}
            role: {type: string, enum: [admin, member]}
            status: {type: string, enum: [active, inactive], description: active一覧・作成応答では省略}
    Category:
      type: object
      required: [id, group_id, name, color_code, sort_order]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        group_id: {$ref: '#/components/schemas/Id'}
        name: {type: string, maxLength: 255}
        color_code: {type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$'}
        sort_order: {type: integer}
    Image:
      type: object
      required: [id, bytes, width, height, mime]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        bytes: {type: integer}
        width: {type: integer}
        height: {type: integer}
        mime: {type: string, const: image/webp}
    Activity:
      type: object
      required: [id, group_id, user_id, category_id, activity_date, content, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        group_id: {$ref: '#/components/schemas/Id'}
        user_id: {$ref: '#/components/schemas/Id'}
        category_id: {$ref: '#/components/schemas/Id'}
        activity_date: {type: string, format: date}
        activity_time: {type: [string, 'null'], description: 'HH:mm'}
        content: {type: string, maxLength: 1000}
        note: {type: [string, 'null'], maxLength: 1000}
        revision: {type: integer, minimum: 1}
        client_request_id: {type: [string, 'null'], format: uuid}
        user:
          type: object
          properties:
            id: {$ref: '#/components/schemas/Id'}
            display_name: {type: string}
        category:
          type: object
          properties:
            id: {$ref: '#/components/schemas/Id'}
            name: {type: string}
            color_code: {type: [string, 'null']}
            sort_order: {type: integer}
        image:
          anyOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        likes_count: {type: integer, minimum: 0, description: ギャラリー応答では省略}
        liked_by_me: {type: boolean, description: ギャラリー応答では省略}
        can_like: {type: boolean, description: ギャラリー応答では省略}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Page:
      type: object
      required: [data, current_page, last_page, total]
      properties:
        data: {type: array, items: {}}
        current_page: {type: integer}
        last_page: {type: integer}
        total: {type: integer}
        per_page: {type: integer}
        from: {type: [integer, 'null']}
        to: {type: [integer, 'null']}
        next_page_url: {type: [string, 'null']}
        prev_page_url: {type: [string, 'null']}
    ActivityInput:
      type: object
      properties:
        category_id: {$ref: '#/components/schemas/Id'}
        activity_date: {type: string, format: date}
        activity_time: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        content: {type: string, minLength: 1, maxLength: 1000}
        note: {type: [string, 'null'], maxLength: 1000}
    RewardInput:
      type: object
      additionalProperties: false
      required: [name, description, metric, color, target_ids, start_month, cycle_months]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        description: {type: string, minLength: 1, maxLength: 500}
        metric: {type: string, enum: [activities, likes]}
        color: {type: string, enum: [gold, silver, bronze]}
        count_mode: {type: string, enum: [fixed, period_days], default: fixed}
        required_count: {type: [integer, 'null'], minimum: 1, maximum: 10000, description: fixedでは1〜10000必須。period_daysでは省略またはnull（空扱い）のみ}
        category_id: {type: [integer, 'null'], minimum: 1}
        target_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
          description: activeな所属ID（user_idではない）。人数上限はFAMIE_MAX_GROUP_MEMBERS、既定10
        start_month: {type: string, pattern: '^\d{4}-\d{2}$', description: 当月以降のYYYY-MM。開始後変更不可}
        cycle_months: {type: integer, minimum: 1, maximum: 12}
        timezone: {type: [string, 'null'], description: IANA timezone。省略時UTC、保存後固定}
        revision: {type: integer, minimum: 1, description: 更新時のみ必須}
      allOf:
        - if:
            properties:
              count_mode:
                const: period_days
            required:
              - count_mode
          then:
            properties:
              required_count:
                type: "null"
          else:
            required:
              - required_count
            properties:
              required_count:
                type: integer
                minimum: 1
                maximum: 10000
    RewardVersion:
      type: object
      required: [id, name, description, metric, color, count_mode, required_count, effective_from]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        description: {type: string}
        metric: {type: string, enum: [activities, likes]}
        color: {type: string, enum: [gold, silver, bronze]}
        count_mode: {type: string, enum: [fixed, period_days]}
        required_count: {type: integer, description: 対象期間内日数を解決した値}
        category_id: {type: [integer, 'null']}
        category_name: {type: [string, 'null']}
        target_ids: {type: array, items: {$ref: '#/components/schemas/Id'}, description: 管理APIのみ。対象者向け条件一覧では省略}
        effective_from: {type: string, format: date}
    Reward:
      type: object
      required: [id, status, revision, start_month, cycle_months, timezone, version, pending_version, starts_on, ends_on, started, progress, awarded, achieved_count]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [draft, active, stopped]}
        revision: {type: integer}
        start_month: {type: string, format: date-time, description: 月初日を表す日時文字列。入力はYYYY-MMだが応答はCarbonの日付オブジェクトがJSON日時化される}
        cycle_months: {type: integer}
        timezone: {type: string}
        version: {$ref: '#/components/schemas/RewardVersion'}
        pending_version:
          anyOf:
            - $ref: '#/components/schemas/RewardVersion'
            - type: 'null'
        starts_on: {type: string, format: date}
        ends_on: {type: string, format: date, description: 表示上の最終日を含む。内部の終了境界は翌日0時}
        started: {type: boolean}
        progress: {type: [integer, 'null']}
        awarded: {type: boolean}
        achieved_count: {type: [integer, 'null']}
    Award:
      type: object
      required: [id, reward_id, awarded_at, read_at, achieved_count, snapshot]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        reward_id: {$ref: '#/components/schemas/Id'}
        group_id: {$ref: '#/components/schemas/Id'}
        group_member_id: {$ref: '#/components/schemas/Id'}
        reward_period_id: {$ref: '#/components/schemas/Id'}
        awarded_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
        achieved_count: {type: integer}
        deleted: {type: boolean, description: 獲得履歴一覧のみ。定義削除済みを示す}
        snapshot:
          type: object
          properties:
            name: {type: string}
            description: {type: string}
            metric: {type: string, enum: [activities, likes]}
            color: {type: string, enum: [gold, silver, bronze]}
            count_mode: {type: string, enum: [fixed, period_days]}
            required_count: {type: integer}
            category_name: {type: [string, 'null']}
            starts_on: {type: string, format: date}
            ends_on: {type: string, format: date}
            timezone: {type: string}
          required:
            - name
            - description
            - metric
            - color
            - required_count
            - category_name
            - starts_on
            - ends_on
            - timezone
  responses:
    Unauthorized:
      description: Bearer未指定・失効
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: IP制限、所属無効、別家族、役割／本人制約
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 対象なし、別家族／無効メンバーの記録など可視範囲外
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validation:
      description: 入力・関連ID・状態・上限などの検証エラー
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: revision競合・所属不整合・集計中・状態遷移／枠制約
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: 操作頻度制限（メールの送信間隔エラーにはRetry-Afterが付かない場合がある）
      headers:
        Retry-After: {schema: {type: integer}, description: 再試行までの秒数、付与される場合のみ}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: メンテナンス時はcode=maintenance。メール配送失敗も503（申請は保存済み）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
